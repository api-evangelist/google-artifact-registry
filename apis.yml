aid: google-artifact-registry
name: Google Artifact Registry
description: >-
  Google Artifact Registry is a universal package manager for managing container images, language packages, and OS
  packages on Google Cloud. It provides a single location for storing and managing artifacts with integration into
  Google Cloud CI/CD tooling, vulnerability scanning, and fine-grained access control.
